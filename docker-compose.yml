services:
  api:
    build: ./backend
    container_name: roastery_api
    working_dir: /app
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - SECRET_KEY=${SECRET_KEY:-super-secret-dev-key-change-me}
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
    ports:
      - "${API_PORT:-8002}:8000"

  frontend:
    build: ./frontend
    container_name: roastery_frontend
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:${API_PORT:-8002}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${WEB_PORT:-3000}:3000"
