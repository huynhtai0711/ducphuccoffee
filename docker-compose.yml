services:
  api:
    build: ./backend
    container_name: roastery_api
    working_dir: /app
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
    ports:
      - "8001:8000"
  frontend:
    build: ./frontend
    container_name: roastery_frontend
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
